- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy custom Nginx index page
  template:
    src: nginx.conf.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Ensure Nginx is running
  service:
    name: nginx
    state: started
    enabled: true