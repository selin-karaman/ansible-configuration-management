services:
  node1:
    image: ubuntu:22.04
    container_name: ansible-node1
    command: >
      /bin/bash -c " apt-get update && apt-get install -y openssh-server python3 sudo && mkdir -p /run/sshd && echo 'root:root' | chpasswd && sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config && sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config && /usr/sbin/sshd -D "
    ports:
      - "2221:22"
      - "8081:80"
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -x sshd > /dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10

